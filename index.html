<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment #3</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f4f4f0;
            --text-color: #111;
            --border-color: #111;
            --shadow-color: #111;
            
            /* Pastel Card Colors */
            --color-0: #ffb3ba; /* Pastel Pink */
            --color-1: #ffdfba; /* Pastel Orange */
            --color-2: #ffffba; /* Pastel Yellow */
            --color-3: #baffc9; /* Pastel Green */
            --color-4: #bae1ff; /* Pastel Blue */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            /* Graph paper dotted background effect */
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 25px 25px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 2rem 1rem 4rem 1rem;
        }

        .header-container {
            position: relative;
            margin-bottom: 4rem;
            margin-top: 2rem;
            text-align: center;
            background: #fff;
            padding: 1.5rem 3rem;
            border: 4px solid var(--border-color);
            box-shadow: 8px 8px 0px var(--shadow-color);
            transform: rotate(-2deg);
            max-width: 90%;
        }

        /* Fake tape piece */
        .header-container::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%) rotate(4deg);
            width: 100px;
            height: 30px;
            background-color: rgba(255, 255, 255, 0.6);
            border: 2px solid var(--border-color);
            z-index: 10;
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .tasks-board {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 600px;
            gap: 2rem;
            position: relative;
        }

        .task-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-color);
            padding: 1.5rem 2rem;
            border: 4px solid var(--border-color);
            box-shadow: 6px 6px 0px var(--shadow-color);
            border-radius: 2px;
            font-size: 1.5rem;
            font-weight: 700;
            width: 80%;
            max-width: 350px;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.2s ease;
            position: relative;
            background-color: var(--card-bg);
            /* Base rotation variable, overridden by individual cards */
            transform: rotate(var(--rot)) translateY(0);
        }

        .task-card::after {
            content: '→';
            font-size: 1.8rem;
            transition: transform 0.2s ease;
        }

        .task-card:hover {
            /* Keep original rotation, but lift the card up and left */
            transform: rotate(var(--rot)) translate(-5px, -5px) scale(1.02);
            box-shadow: 12px 12px 0px var(--shadow-color);
            z-index: 5;
        }

        .task-card:hover::after {
            transform: translateX(5px);
        }

        
        /* Task 0 */
        .task-card:nth-child(1) {
            --card-bg: var(--color-0);
            --rot: -4deg;
            align-self: flex-start;
            margin-left: 5%;
        }

        /* Task 1 */
        .task-card:nth-child(2) {
            --card-bg: var(--color-1);
            --rot: 3deg;
            align-self: flex-end;
            margin-right: 5%;
            margin-top: -10px; /* Slight overlap */
        }

        /* Task 2 */
        .task-card:nth-child(3) {
            --card-bg: var(--color-2);
            --rot: -2deg;
            align-self: center;
            margin-left: -15%;
        }

        /* Task 3 */
        .task-card:nth-child(4) {
            --card-bg: var(--color-3);
            --rot: 5deg;
            align-self: flex-start;
            margin-left: 15%;
            margin-top: -15px;
        }

        /* Task 4 */
        .task-card:nth-child(5) {
            --card-bg: var(--color-4);
            --rot: -3deg;
            align-self: flex-end;
            margin-right: 10%;
        }

        /* Mobile tweaks to prevent overflow */
        @media (max-width: 500px) {
            .task-card {
                width: 95%;
                margin-left: 0 !important;
                margin-right: 0 !important;
                align-self: center !important;
                /* Reduce rotation severity on small screens */
                --rot: calc(var(--rot) * 0.5); 
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Assignment #3</h1>
        <p>Pick a task to get started</p>
    </div>

    <div class="tasks-board">
        <a href="Task_0.html" class="task-card">
            Task #0
        </a>
        
        <a href="Task_1.html" class="task-card">
            Task #1
        </a>
        
        <a href="Task_2.html" class="task-card">
            Task #2
        </a>
        
        <a href="Task_3.html" class="task-card">
            Task #3
        </a>
        
        <a href="Task_4.html" class="task-card">
            Task #4
        </a>
    </div>

</body>
</html>
