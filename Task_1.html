<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task #1</title>
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #334155;
            --box1-color: #ff0000;
            --box2-color: #00ff00;
            --box3-color: #0000ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            max-width: 800px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #0f172a;
            margin-bottom: 1rem;
        }

        header p {
            font-size: 1.1rem;
            color: #64748b;
        }

        /* By default (Mobile), we stack them vertically using 1 column */
        .layout-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            width: 100%;
            max-width: 1200px;
        }

        .box {
            background: #ffffff;
            border-radius: 16px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .box:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .box h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #1e293b;
        }

        .box p {
            color: #64748b;
            line-height: 1.6;
        }

        /* Styling individual boxes with subtle top borders for aesthetics */
        .box-1 { border-top: 6px solid var(--box1-color); }
        .box-2 { border-top: 6px solid var(--box2-color); }
        .box-3 { border-top: 6px solid var(--box3-color); }

        /* Tablet breakpoint: 600px and up */
        @media (min-width: 600px) {
            .layout-container {
                /* Two columns of equal width */
                grid-template-columns: repeat(2, 1fr);
            }
            
            .box-3 {
                grid-column: span 2;
            }
        }

        /* Desktop breakpoint: 1024px and up */
        @media (min-width: 1024px) {
            .layout-container {
                /* Three columns of equal width */
                grid-template-columns: repeat(3, 1fr);
            }

            /* Reset the 3rd box to only take up one column on desktop */
            .box-3 {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <header>
        <p style="color: #000000;"">You're now on <strong>Task #1</strong></p>
        <h1>
            Responsive Box Layout
        </h1>
        <p>Resize your browser window to see the layout shift. It uses <strong>CSS Grid and media queries</strong> to adapt to Desktop, Tablet, and Mobile screens.</p>
    </header>

    <div class="layout-container">
        <div class="box box-1">
            <h2>Box #1</h2>
        </div>
        
        <div class="box box-2">
            <h2>Box #2</h2>
        </div>
        
        <div class="box box-3">
            <h2>Box #3</h2>
        </div>
    </div>
</body>
</html>
